# Stack для Portainer: только pull готового образа (без build на сервере).
# Образ собирается в GitHub Actions и публикуется в GHCR.
# Форк: замените image на ghcr.io/<ваш-логин>/domen_mail:latest или дождитесь своего CI.
# Приватный пакет: в Portainer добавьте Registry (ghcr.io + GitHub PAT с read:packages).

services:
  domen-mail:
    image: ghcr.io/sereza111/domen_mail:latest
    container_name: domen-mail
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      IMAP_HOST: ${IMAP_HOST:-imap.beget.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_TLS: ${IMAP_TLS:-true}
