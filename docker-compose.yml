# Без секции build — Portainer только делает pull (иначе срабатывает баг buildx/http2).
# Образ: GitHub Actions → ghcr.io/sereza111/domen_mail

services:
  domen-mail:
    image: ${DOCKER_IMAGE:-ghcr.io/sereza111/domen_mail:latest}
    container_name: domen-mail
    restart: unless-stopped

    # Порт снаружи хоста — 3002 (3000 часто занят Portainer и другими сервисами)
    # Если нужно изменить — поменяй первое число (3002)
    ports:
      - "3002:3000"        # ← Захардкожено, чтобы Portainer не падал

    environment:
      PORT: "3000"
      IMAP_HOST: ${IMAP_HOST:-imap.beget.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_TLS: ${IMAP_TLS:-true}
