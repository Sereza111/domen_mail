# Без секции build — Portainer только делает pull (иначе срабатывает баг buildx/http2).
# Образ: GitHub Actions → ghcr.io/sereza111/domen_mail
# Локально собрать: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  domen-mail:
    image: ${DOCKER_IMAGE:-ghcr.io/sereza111/domen_mail:latest}
    container_name: domen-mail
    restart: unless-stopped
    # Снаружи хоста по умолчанию 3001 (3000 часто занят Portainer/другими сервисами).
    # Другой порт: в стеке задайте HOST_PORT=3002 и т.д.
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      IMAP_HOST: ${IMAP_HOST:-imap.beget.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_TLS: ${IMAP_TLS:-true}
