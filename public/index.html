<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1013">
    <title>Mail Codex — почта</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark" aria-hidden="true">✠</span><span class="brand-name">Mail Codex</span><span class="brand-section">/ Почта</span></div>
            <div class="topbar-actions">
                <a class="generator-link" href="https://mailgen.yozik.ru" target="_blank" rel="noopener noreferrer"><i class="bi bi-grid"></i><span>Генератор</span></a>
                <span id="connectionStatus" class="connection-status"><i class="bi bi-circle-fill"></i><span>Не подключено</span></span>
            </div>
        </header>

        <main id="loginView" class="login-layout">
            <div class="login-heading"><span class="eyebrow">ЛИЧНЫЙ ПОЧТОВЫЙ КАБИНЕТ</span><h1>Вход в почту</h1></div>
            <div class="login-panel">
                <form id="loginForm">
                    <label for="emailInput">Адрес ящика</label>
                    <input id="emailInput" type="email" autocomplete="username" placeholder="name@example.com" required>
                    <label for="passwordInput">Пароль</label>
                    <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Пароль ящика" required>
                    <button id="loginButton" type="submit" class="button button-primary"><i class="bi bi-box-arrow-in-right"></i> Войти</button>
                </form>
            </div>
        </main>

        <div id="workspace" class="workspace" hidden>
            <aside class="sidebar">
                <div class="account-block"><span class="account-label">Текущий ящик</span><strong id="accountEmail"></strong></div>
                <nav class="workspace-nav" aria-label="Разделы почты">
                    <button type="button" class="nav-item active" data-view="inbox"><i class="bi bi-inbox"></i><span>Входящие</span><span id="inboxCount" class="nav-count">0</span></button>
                    <button type="button" class="nav-item" data-view="compose"><i class="bi bi-pencil-square"></i><span>Написать</span></button>
                    <button type="button" class="nav-item" data-view="scheduled"><i class="bi bi-clock-history"></i><span>Отложенные</span></button>
                </nav>
                <div class="sidebar-bottom"><button id="logoutButton" type="button" class="text-button"><i class="bi bi-box-arrow-left"></i> Выйти</button></div>
            </aside>

            <main class="content-area">
                <section id="inboxView" class="view">
                    <div class="view-heading"><div><span class="eyebrow">ПОЧТОВЫЙ ЯЩИК</span><h1>Входящие</h1></div><button id="composeShortcut" type="button" class="button button-primary"><i class="bi bi-pencil-square"></i> Написать</button></div>
                    <div class="toolbar"><div class="search-field"><i class="bi bi-search"></i><input id="messageSearch" type="search" placeholder="Поиск по письмам" aria-label="Поиск по письмам"></div><button id="refreshButton" type="button" class="icon-button" title="Обновить письма" aria-label="Обновить письма"><i class="bi bi-arrow-clockwise"></i></button><span id="messageCount" class="toolbar-count"></span></div>
                    <div id="messageList" class="message-list"></div>
                </section>

                <section id="messageView" class="view" hidden>
                    <div class="detail-toolbar"><button id="backButton" type="button" class="text-button"><i class="bi bi-arrow-left"></i> Входящие</button><button id="replyButton" type="button" class="button button-secondary"><i class="bi bi-reply"></i> Ответить</button></div>
                    <div class="message-detail"><span class="eyebrow">ПИСЬМО</span><h1 id="detailSubject"></h1><div id="detailMeta" class="detail-meta"></div><div id="detailContent" class="detail-content"></div></div>
                </section>

                <section id="composeView" class="view" hidden>
                    <div class="view-heading"><div><span class="eyebrow">НОВОЕ СООБЩЕНИЕ</span><h1>Написать письмо</h1></div></div>
                    <form id="composeForm" class="compose-form">
                        <div class="form-row"><label for="toInput">Кому</label><input id="toInput" type="text" autocomplete="off" placeholder="recipient@example.com" required></div>
                        <details class="extra-recipients"><summary>Копия и скрытая копия</summary><div class="form-row"><label for="ccInput">Копия</label><input id="ccInput" type="text" autocomplete="off" placeholder="Адреса через запятую"></div><div class="form-row"><label for="bccInput">Скрытая</label><input id="bccInput" type="text" autocomplete="off" placeholder="Адреса через запятую"></div></details>
                        <div class="form-row"><label for="subjectInput">Тема</label><input id="subjectInput" type="text" maxlength="200" placeholder="Тема письма"></div>
                        <div class="form-row message-editor"><label for="bodyInput">Сообщение</label><textarea id="bodyInput" rows="14" maxlength="100000" placeholder="Текст письма" required></textarea></div>
                        <div class="compose-footer"><label class="schedule-control"><input id="scheduleToggle" type="checkbox"><span>Отправить позже</span></label><div id="scheduleFields" class="schedule-fields" hidden><label for="sendAtInput">Дата и время</label><input id="sendAtInput" type="datetime-local"></div><button id="sendButton" type="submit" class="button button-primary"><i class="bi bi-send"></i><span id="sendButtonText">Отправить</span></button></div>
                    </form>
                </section>

                <section id="scheduledView" class="view" hidden>
                    <div class="view-heading"><div><span class="eyebrow">ОЧЕРЕДЬ ПИСЕМ</span><h1>Отложенные</h1></div><button id="refreshScheduledButton" type="button" class="icon-button" title="Обновить очередь" aria-label="Обновить очередь"><i class="bi bi-arrow-clockwise"></i></button></div>
                    <div id="scheduledList" class="scheduled-list"></div>
                </section>
            </main>
        </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
